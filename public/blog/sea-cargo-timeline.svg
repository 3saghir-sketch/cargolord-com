<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0C1535"/>
    </linearGradient>
    <linearGradient id="timeline8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg8)"/>
  <g opacity="0.25">
    <circle cx="60" cy="50" r="1.4" fill="#fff"/>
    <circle cx="740" cy="60" r="1.4" fill="#fff"/>
    <circle cx="50" cy="400" r="1.4" fill="#fff"/>
    <circle cx="730" cy="410" r="1.4" fill="#fff"/>
  </g>

  <text x="400" y="56" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">12&#8211;13 WEEKS</text>
  <text x="400" y="80" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="700" font-family="Arial, sans-serif" letter-spacing="2">DOOR-TO-DOOR SEA CARGO TIMELINE</text>

  <!-- timeline baseline -->
  <line x1="80" y1="240" x2="720" y2="240" stroke="url(#timeline8)" stroke-width="4" stroke-linecap="round"/>

  <!-- Stage 1: Collection -->
  <g transform="translate(80,240)">
    <circle r="9" fill="#f97316"/>
    <circle r="9" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(0,-55)">
      <rect x="-18" y="-10" width="36" height="24" rx="3" fill="#ffffff" opacity="0.9"/>
      <path d="M-22,-10 L0,-26 L22,-10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    </g>
    <text x="0" y="40" text-anchor="middle" fill="#fdba74" font-size="11.5" font-weight="700" font-family="Arial, sans-serif">COLLECTION</text>
    <text x="0" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Arial, sans-serif">Free, UK-wide</text>
  </g>

  <!-- Stage 2: Warehouse prep -->
  <g transform="translate(240,240)">
    <circle r="9" fill="#f97316"/>
    <circle r="9" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(0,-55)">
      <rect x="-20" y="-16" width="16" height="16" fill="#c8942a"/>
      <rect x="-2" y="-20" width="16" height="20" fill="#e8ad3a"/>
      <rect x="16" y="-14" width="14" height="14" fill="#a9771c"/>
    </g>
    <text x="0" y="40" text-anchor="middle" fill="#fdba74" font-size="11.5" font-weight="700" font-family="Arial, sans-serif">WAREHOUSE PREP</text>
    <text x="0" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Arial, sans-serif">Stacked &amp; measured</text>
  </g>

  <!-- Stage 3: Departs UK -->
  <g transform="translate(400,240)">
    <circle r="9" fill="#fb923c"/>
    <circle r="9" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(0,-58)">
      <path d="M-24,8 L-10,-4 L24,-4 L30,8 L30,14 L-24,14 Z" fill="#60a5fa"/>
      <rect x="-4" y="-16" width="10" height="14" fill="#93c5fd"/>
    </g>
    <text x="0" y="40" text-anchor="middle" fill="#fdba74" font-size="11.5" font-weight="700" font-family="Arial, sans-serif">DEPARTS UK</text>
    <text x="0" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Arial, sans-serif">Vessel booking</text>
  </g>

  <!-- Stage 4: At sea / Suez -->
  <g transform="translate(560,240)">
    <circle r="9" fill="#60a5fa"/>
    <circle r="9" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(0,-58)" stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M-26,0 q8,-9 16,0 q8,9 16,0 q8,-9 16,0"/>
      <path d="M-26,12 q8,-9 16,0 q8,9 16,0 q8,-9 16,0"/>
    </g>
    <text x="0" y="40" text-anchor="middle" fill="#93c5fd" font-size="11.5" font-weight="700" font-family="Arial, sans-serif">AT SEA</text>
    <text x="0" y="56" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Arial, sans-serif">Route via Suez</text>
  </g>

  <!-- Stage 5: Karachi customs -->
  <g transform="translate(720,240)">
    <circle r="9" fill="#15a862"/>
    <circle r="9" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <g transform="translate(0,-58)">
      <circle r="17" fill="none" stroke="#15a862" stroke-width="2.5"/>
      <path d="M-6,0 L-2,5 L7,-6" fill="none" stroke="#15a862" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="-10" y="40" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700" font-family="Arial, sans-serif">KARACHI &amp;</text>
    <text x="-10" y="54" text-anchor="middle" fill="#6ee7b7" font-size="11.5" font-weight="700" font-family="Arial, sans-serif">DELIVERY</text>
  </g>

  <rect x="150" y="340" width="500" height="50" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="400" y="371" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="700" font-family="Arial, sans-serif">We hit our estimated delivery dates around 99% of the time</text>
</svg>
