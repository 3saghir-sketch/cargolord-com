  <text x="560" y="300" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">KNOW BEFORE</text>
  <text x="560" y="326" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">YOU SEND</text>
