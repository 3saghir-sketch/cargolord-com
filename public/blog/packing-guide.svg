<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1535"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <g opacity="0.25">
    <circle cx="60" cy="60" r="1.4" fill="#fff"/>
    <circle cx="730" cy="80" r="1.4" fill="#fff"/>
    <circle cx="80" cy="400" r="1.4" fill="#fff"/>
    <circle cx="740" cy="390" r="1.4" fill="#fff"/>
  </g>

  <!-- Open box -->
  <g transform="translate(300,260)">
    <path d="M-120,0 L0,-45 L120,0 L0,45 Z" fill="#c8942a" opacity="0.95"/>
    <path d="M-120,0 L-120,70 L0,115 L0,45 Z" fill="#a9771c"/>
    <path d="M120,0 L120,70 L0,115 L0,45 Z" fill="#8c6116"/>
    <path d="M-120,0 L-150,-20 L-30,-65 L0,-45 Z" fill="#e8ad3a"/>
    <path d="M120,0 L150,-20 L30,-65 L0,-45 Z" fill="#d49a2e"/>
    <line x1="-60" y1="-22" x2="-60" y2="80" stroke="#8c6116" stroke-width="2" opacity="0.5"/>
    <line x1="60" y1="-22" x2="60" y2="80" stroke="#6b4a10" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Tape -->
  <g transform="translate(300,170) rotate(-6)">
    <rect x="-50" y="-10" width="100" height="22" rx="3" fill="#fde68a" opacity="0.92"/>
  </g>

  <!-- Shipping label -->
  <g transform="translate(540,180)">
    <rect x="-70" y="-50" width="140" height="100" rx="6" fill="#ffffff"/>
    <rect x="-70" y="-50" width="140" height="24" rx="6" fill="#f97316"/>
    <text x="0" y="-33" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1">CARGO LORD</text>
    <g transform="translate(-50,-10)" fill="#0f172a">
      <rect x="0" y="0" width="3" height="28"/>
      <rect x="6" y="0" width="1.5" height="28"/>
      <rect x="10" y="0" width="4" height="28"/>
      <rect x="17" y="0" width="1.5" height="28"/>
      <rect x="21" y="0" width="2.5" height="28"/>
      <rect x="27" y="0" width="4" height="28"/>
      <rect x="34" y="0" width="1.5" height="28"/>
      <rect x="38" y="0" width="3" height="28"/>
      <rect x="44" y="0" width="2" height="28"/>
      <rect x="49" y="0" width="4" height="28"/>
      <rect x="56" y="0" width="1.5" height="28"/>
      <rect x="60" y="0" width="3" height="28"/>
      <rect x="66" y="0" width="2" height="28"/>
      <rect x="71" y="0" width="4" height="28"/>
      <rect x="78" y="0" width="1.5" height="28"/>
      <rect x="82" y="0" width="3" height="28"/>
      <rect x="88" y="0" width="2" height="28"/>
      <rect x="93" y="0" width="4" height="28"/>
      <rect x="100" y="0" width="1.5" height="28"/>
      <rect x="105" y="0" width="3" height="28"/>
      <rect x="110" y="0" width="2" height="28"/>
      <rect x="115" y="0" width="4" height="28"/>
    </g>
    <text x="0" y="40" text-anchor="middle" fill="#334155" font-size="10" font-family="Arial, sans-serif" letter-spacing="1">CL-00000</text>
  </g>

  <!-- Checklist -->
  <g transform="translate(120,110)" font-family="Arial, sans-serif">
    <text x="0" y="0" fill="#fff" font-size="16" font-weight="800" letter-spacing="1">PACKING CHECKLIST</text>
    <g transform="translate(0,22)">
      <circle r="9" fill="none" stroke="#fb923c" stroke-width="2"/>
      <path d="M-4 0 L-1 4 L5 -4" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="5" fill="#cbd5e1" font-size="13">Strong double-wall box</text>
    </g>
    <g transform="translate(0,50)">
      <circle r="9" fill="none" stroke="#fb923c" stroke-width="2"/>
      <path d="M-4 0 L-1 4 L5 -4" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="5" fill="#cbd5e1" font-size="13">Padding around fragile items</text>
    </g>
    <g transform="translate(0,78)">
      <circle r="9" fill="none" stroke="#fb923c" stroke-width="2"/>
      <path d="M-4 0 L-1 4 L5 -4" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="5" fill="#cbd5e1" font-size="13">Clear address label</text>
    </g>
  </g>
</svg>
